name: Deploy to EC2 (Smart + Health Check)

on:
  push:
    branches: ["main"]

concurrency:
  group: devopsians-ec2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail

            REPO_DIR="/home/ec2-user/Devopsians"
            CACHE_DIR="/home/ec2-user/.deploy-cache"
            mkdir -p "$CACHE_DIR"

            echo "==> Ensure repo exists"
            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR"
              OLD_SHA="$(cat "$CACHE_DIR/last_sha" 2>/dev/null || true)"
              git fetch --all
              git reset --hard origin/main
            else
              cd /home/ec2-user
              git clone https://github.com/Mo7amed7osam/Devopsians.git
              cd "$REPO_DIR"
              OLD_SHA=""
            fi

            NEW_SHA="$(git rev-parse HEAD)"
            echo "$NEW_SHA" > "$CACHE_DIR/last_sha"
            echo "==> Deployed commit: $NEW_SHA"

            # Detect changes
            BACKEND_CHANGED=1
            FRONTEND_CHANGED=1

            if [ -n "${OLD_SHA}" ] && git cat-file -e "${OLD_SHA}^{commit}" 2>/dev/null; then
              CHANGED_FILES="$(git diff --name-only "$OLD_SHA" "$NEW_SHA" || true)"
              echo "==> Changed files since last deploy:"
              echo "$CHANGED_FILES" | sed '/^$/d' || true

              BACKEND_CHANGED=0
              FRONTEND_CHANGED=0

              echo "$CHANGED_FILES" | grep -qE '^(backend/|package.json|package-lock.json)' && BACKEND_CHANGED=1 || true
              echo "$CHANGED_FILES" | grep -qE '^(frontend/|package.json|package-lock.json)' && FRONTEND_CHANGED=1 || true
            fi

            echo "==> Backend changed?  $BACKEND_CHANGED"
            echo "==> Frontend changed? $FRONTEND_CHANGED"

            # Backend deploy
            if [ "$BACKEND_CHANGED" -eq 1 ]; then
              echo "==> Backend: install & restart"
              cd "$REPO_DIR/backend"

              if [ -f package-lock.json ]; then
                npm ci --omit=dev
              else
                npm install --omit=dev
              fi

              if pm2 describe devopsians-backend >/dev/null 2>&1; then
                pm2 restart devopsians-backend --update-env
              else
                pm2 start index.js --name devopsians-backend
              fi

              pm2 save
            else
              echo "==> Backend unchanged, skipping."
            fi

            # Frontend deploy
            if [ "$FRONTEND_CHANGED" -eq 1 ]; then
              echo "==> Frontend: install & build"
              cd "$REPO_DIR/frontend"

              if [ -f package-lock.json ]; then
                npm ci
              else
                npm install
              fi

              npm run build

              echo "==> Publish frontend via rsync"
              sudo rsync -a --delete "$REPO_DIR/frontend/dist/" /usr/share/nginx/html/

              echo "==> Restart nginx"
              sudo systemctl restart nginx
            else
              echo "==> Frontend unchanged, skipping."
            fi

            echo "==> Health checks"

            # -----------------------------------------
            # OLD CHECKS (commented - kept for history)
            # -----------------------------------------
            # # 1) Frontend should return 200
            # curl -fsS -o /dev/null -I http://127.0.0.1
            #
            # # 2) Backend process should be online
            # pm2 jlist | grep -q '"name":"devopsians-backend"' || (echo "❌ PM2 app not found" && exit 1)
            # pm2 describe devopsians-backend | grep -q "status *online" || (echo "❌ Backend not online" && pm2 logs devopsians-backend --lines 80 && exit 1)
            #
            # # 3) Backend port open locally
            # curl -fsS -o /dev/null http://127.0.0.1:5000 || (echo "❌ Backend not responding on 5000" && pm2 logs devopsians-backend --lines 80 && exit 1)

            # -----------------------------------------
            # NEW CHECKS (robust + correct)
            # -----------------------------------------

            # 1) Nginx check (should respond on port 80)
            if curl -fsS -I http://127.0.0.1 >/dev/null; then
              echo "✅ Nginx OK (127.0.0.1:80)"
            else
              echo "❌ Nginx not responding"
              sudo systemctl status nginx --no-pager || true
              sudo tail -n 80 /var/log/nginx/error.log || true
              exit 1
            fi

            # 2) PM2 process existence (avoid parsing describe output)
            if pm2 id devopsians-backend >/dev/null 2>&1; then
              echo "✅ PM2 app exists: devopsians-backend"
            else
              echo "❌ PM2 app not found: devopsians-backend"
              pm2 status || true
              exit 1
            fi

            # 3) Backend health endpoint (real truth)
            # NOTE: change 5000 if your backend runs on a different port
            if curl -fsS http://127.0.0.1:5000/health >/dev/null; then
              echo "✅ Backend OK (5000/health)"
            else
              echo "❌ Backend health failed (5000/health)"
              echo "---- pm2 status ----"
              pm2 status || true
              echo "---- backend logs (last 120 lines) ----"
              pm2 logs devopsians-backend --lines 120 || true
              exit 1
            fi

            echo "✅ EC2 deploy done + healthy"
