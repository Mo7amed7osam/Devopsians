name: Deploy to EC2 (Smart + Env + Health)

on:
  push:
    branches: ["main"]

concurrency:
  group: devopsians-ec2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail

            REPO_DIR="/home/ec2-user/Devopsians"
            CACHE_DIR="/home/ec2-user/.deploy-cache"
            mkdir -p "$CACHE_DIR"

            echo "==> Ensure repo exists"
            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR"
              OLD_SHA="$(cat "$CACHE_DIR/last_sha" 2>/dev/null || true)"
              git fetch --all
              git reset --hard origin/main
            else
              cd /home/ec2-user
              git clone https://github.com/Mo7amed7osam/Devopsians.git
              cd "$REPO_DIR"
              OLD_SHA=""
            fi

            NEW_SHA="$(git rev-parse HEAD)"
            echo "$NEW_SHA" > "$CACHE_DIR/last_sha"
            echo "==> Deployed commit: $NEW_SHA"

            # Detect changes
            BACKEND_CHANGED=1
            FRONTEND_CHANGED=1

            if [ -n "${OLD_SHA}" ] && git cat-file -e "${OLD_SHA}^{commit}" 2>/dev/null; then
              CHANGED_FILES="$(git diff --name-only "$OLD_SHA" "$NEW_SHA" || true)"
              echo "==> Changed files since last deploy:"
              echo "$CHANGED_FILES" | sed '/^$/d' || true

              BACKEND_CHANGED=0
              FRONTEND_CHANGED=0

              echo "$CHANGED_FILES" | grep -qE '^(backend/|package.json|package-lock.json)' && BACKEND_CHANGED=1 || true
              echo "$CHANGED_FILES" | grep -qE '^(frontend/|package.json|package-lock.json)' && FRONTEND_CHANGED=1 || true
            fi

            echo "==> Backend changed?  $BACKEND_CHANGED"
            echo "==> Frontend changed? $FRONTEND_CHANGED"

            echo "==> Write backend .env from GitHub Secrets"
            cat > "$REPO_DIR/backend/.env" << 'EOF'
            MONGO_URL=${{ secrets.MONGO_URL }}
            PORT=${{ secrets.BACKEND_PORT }}
            NODE_ENV=production
            CORS_ALLOW_ALL=true
            FRONTEND_URL=http://${{ secrets.EC2_HOST }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            EOF
            chmod 600 "$REPO_DIR/backend/.env"

            # Backend deploy
            if [ "$BACKEND_CHANGED" -eq 1 ]; then
              echo "==> Backend: install & restart"
              cd "$REPO_DIR/backend"

              if [ -f package-lock.json ]; then
                npm ci --omit=dev
              else
                npm install --omit=dev
              fi

              if pm2 describe devopsians-backend >/dev/null 2>&1; then
                pm2 restart devopsians-backend --update-env
              else
                pm2 start index.js --name devopsians-backend
              fi

              pm2 save
            else
              echo "==> Backend unchanged, restarting to ensure env is loaded"
              pm2 restart devopsians-backend --update-env || true
              pm2 save || true
            fi

            # Frontend deploy
            if [ "$FRONTEND_CHANGED" -eq 1 ]; then
              echo "==> Frontend: install & build"
              cd "$REPO_DIR/frontend"

              if [ -f package-lock.json ]; then
                npm ci
              else
                npm install
              fi

              npm run build

              echo "==> Publish frontend via rsync"
              sudo rsync -a --delete "$REPO_DIR/frontend/dist/" /usr/share/nginx/html/

              echo "==> Restart nginx"
              sudo systemctl restart nginx
            else
              echo "==> Frontend unchanged, skipping."
            fi

            echo "==> Health checks"
            echo "✅ Nginx OK (127.0.0.1:80)"
            curl -fsS -o /dev/null -I http://127.0.0.1

            echo "✅ PM2 app exists: devopsians-backend"
            pm2 describe devopsians-backend >/dev/null

            echo "==> Wait for backend port"
            for i in {1..15}; do
              if curl -fsS http://127.0.0.1:${{ secrets.BACKEND_PORT }}/health >/dev/null; then
                echo "✅ Backend health OK"
                break
              fi
              sleep 1
              if [ "$i" -eq 15 ]; then
                echo "❌ Backend health failed"
                pm2 status
                pm2 logs devopsians-backend --lines 120
                exit 1
              fi
            done

            echo "✅ EC2 deploy done + healthy"
